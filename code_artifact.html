<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban AI Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bx: #630d16;
  --bx2: #8e1a25;
  --bx-pale: rgba(99,13,22,0.07);
  --bx-mid: rgba(99,13,22,0.15);
  --paper: #fcfcf9;
  --white: #ffffff;
  --border: #e8e8e8;
  --text: #1a1a1a;
  --muted: #888;
  --step-blue: #1d4ed8;
  --step-blue-pale: rgba(29,78,216,0.07);
  --green: #16a34a;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { font-size:18px; }
html, body { height:100%; overflow:hidden; }
body {
  font-family:'Assistant',sans-serif;
  background:var(--paper);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* ═══════════════════════════════
   חלק 1 — סרגל ניווט אנכי
═══════════════════════════════ */
#nav-bar {
  width:220px;
  flex-shrink:0;
  height:100vh;
  background:var(--white);
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  box-shadow:-2px 0 12px rgba(0,0,0,0.04);
  z-index:20;
}

.nav-logo {
  padding:1.8rem 1.4rem 1.5rem;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nav-logo-eyebrow {
  font-size:0.52rem;
  text-transform:uppercase;
  letter-spacing:8px;
  color:#ccc;
  font-weight:700;
  display:block;
  margin-bottom:5px;
}
.nav-logo-title {
  font-family:'Playfair Display',serif;
  font-size:1.3rem;
  font-weight:900;
  color:var(--bx);
  line-height:1.2;
}

.nav-section-label {
  font-size:0.52rem;
  text-transform:uppercase;
  letter-spacing:5px;
  color:#ccc;
  font-weight:700;
  padding:1.2rem 1.4rem 0.5rem;
  display:block;
}

.nav-chapters {
  flex:1;
  overflow-y:auto;
  padding-bottom:0.5rem;
}

/* כפתור פרק בסרגל */
.nav-ch-btn {
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0.75rem 1.4rem;
  background:none;
  border:none;
  border-right:3px solid transparent;
  cursor:pointer;
  font-family:'Assistant',sans-serif;
  font-size:0.82rem;
  font-weight:600;
  color:#666;
  text-align:right;
  transition:all 0.2s;
  text-transform:uppercase;
  letter-spacing:1.5px;
}
.nav-ch-btn .ch-num {
  font-family:monospace;
  font-size:0.62rem;
  opacity:0.4;
  min-width:22px;
}
.nav-ch-btn:hover { color:var(--bx); background:var(--bx-pale); }
.nav-ch-btn.active {
  color:var(--bx);
  background:var(--bx-pale);
  border-right-color:var(--bx);
  font-weight:800;
}

.nav-divider { height:1px; background:var(--border); margin:0.5rem 1rem; }

/* כלי סטודיו */
.nav-tools {
  padding:1rem 1.2rem;
  border-top:1px solid var(--border);
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  flex-shrink:0;
}
.tool-btn {
  background:none;
  border:1px solid var(--border);
  border-radius:6px;
  width:36px;
  height:36px;
  cursor:pointer;
  font-size:0.95rem;
  transition:all 0.18s;
  color:#999;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tool-btn:hover { border-color:var(--bx); color:var(--bx); background:var(--bx-pale); }
.tool-btn.active { background:var(--bx); color:#fff; border-color:var(--bx); }
.tool-tip {
  position:absolute;
  bottom:calc(100% + 6px);
  right:50%;
  transform:translateX(50%);
  background:#111;
  color:#fff;
  font-size:0.65rem;
  white-space:nowrap;
  padding:3px 8px;
  border-radius:3px;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.15s;
  font-family:'Assistant',sans-serif;
  letter-spacing:1px;
}
.tool-btn:hover .tool-tip { opacity:1; }

/* ═══════════════════════════════
   חלק 2 — חלון הקשר ורקע
═══════════════════════════════ */
#ctx-pane {
  width:380px;
  flex-shrink:0;
  height:100vh;
  background:var(--white);
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.pane-header {
  padding:1rem 1.5rem;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:48px;
}
.pane-header-label {
  font-size:0.55rem;
  text-transform:uppercase;
  letter-spacing:6px;
  color:#ccc;
  font-weight:700;
}
.pane-header-chapter {
  font-size:0.75rem;
  font-weight:800;
  color:var(--bx);
  text-transform:uppercase;
  letter-spacing:2px;
}

.ctx-body {
  flex:1;
  overflow-y:auto;
  padding:1.5rem;
}

/* מידע הקשר בראש */
.ctx-chapter-num {
  font-family:'Playfair Display',serif;
  font-size:5rem;
  font-weight:900;
  color:var(--bx);
  opacity:0.06;
  line-height:1;
  user-select:none;
  margin-bottom:-0.5rem;
}
.ctx-title {
  font-family:'Playfair Display',serif;
  font-size:1.8rem;
  font-weight:900;
  color:#111;
  line-height:1.2;
  margin-bottom:0.7rem;
}
.ctx-desc {
  font-size:0.9rem;
  font-weight:300;
  line-height:1.7;
  color:#555;
  margin-bottom:1.2rem;
}
.ctx-divider {
  height:1px;
  background:var(--border);
  margin:1.2rem 0;
}
.ctx-section-label {
  font-size:0.55rem;
  text-transform:uppercase;
  letter-spacing:5px;
  color:#bbb;
  font-weight:700;
  display:block;
  margin-bottom:0.6rem;
}

/* כפתורי ניווט בחלון הקשר */
.ctx-btn-list {
  display:flex;
  flex-direction:column;
  gap:0.5rem;
}

.ctx-btn {
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0.75rem 1rem;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:5px;
  cursor:pointer;
  font-family:'Assistant',sans-serif;
  font-size:0.85rem;
  font-weight:600;
  color:#444;
  text-align:right;
  transition:all 0.2s;
  position:relative;
}
.ctx-btn .btn-num {
  font-family:monospace;
  font-size:0.62rem;
  color:#bbb;
  min-width:20px;
}
.ctx-btn .btn-label { flex:1; }
.ctx-btn .btn-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:transparent;
  border:1.5px solid #ddd;
  flex-shrink:0;
  transition:all 0.2s;
}

/* מצב active (נלחץ) */
.ctx-btn:hover { border-color:rgba(99,13,22,0.25); background:var(--bx-pale); color:var(--bx); }
.ctx-btn:hover .btn-dot { border-color:var(--bx); }

.ctx-btn.active {
  background:var(--bx-pale);
  border-color:var(--bx);
  color:var(--bx);
  font-weight:800;
}
.ctx-btn.active .btn-dot {
  background:var(--bx);
  border-color:var(--bx);
}
.ctx-btn.active .btn-num { color:var(--bx); opacity:0.6; }

/* וריאציות צבע לפי סוג */
.ctx-btn.type-step { border-right:3px solid var(--step-blue); }
.ctx-btn.type-step:hover, .ctx-btn.type-step.active { background:var(--step-blue-pale); border-color:var(--step-blue); color:var(--step-blue); }
.ctx-btn.type-step.active .btn-dot { background:var(--step-blue); border-color:var(--step-blue); }

.ctx-btn.type-parcel { border-right:3px solid #64748b; }
.ctx-btn.type-exercise { border-right:3px dashed #d97706; }
.ctx-btn.type-exercise:hover, .ctx-btn.type-exercise.active { background:#fffbf0; border-color:#d97706; color:#d97706; }

/* ═══════════════════════════════
   חלק 3 — חלון פעולות וכלים
═══════════════════════════════ */
#act-pane {
  flex:1;
  height:100vh;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.act-body {
  flex:1;
  overflow-y:auto;
  padding:1.5rem 2rem 3rem;
}

/* מצב ריק (לפני בחירה) */
.act-empty {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  color:#ccc;
  text-align:center;
  gap:0.8rem;
  padding:2rem;
}
.act-empty-arrow {
  font-size:2rem;
  opacity:0.3;
}
.act-empty-text {
  font-size:0.85rem;
  font-weight:300;
  line-height:1.6;
}

/* בלוקים בחלון הפעולות */
.act-block {
  background:var(--white);
  border:1px solid var(--border);
  border-radius:5px;
  margin-bottom:1rem;
  overflow:hidden;
}

.act-block-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0.55rem 1rem;
  border-bottom:1px solid var(--border);
  background:#fafafa;
}
.act-type-tag {
  font-size:0.56rem;
  text-transform:uppercase;
  letter-spacing:5px;
  font-weight:800;
  color:#bbb;
}
.act-type-tag.פרומפט { color:var(--bx); }
.act-type-tag.שלב { color:var(--step-blue); }
.act-type-tag.תרגיל { color:#d97706; }
.act-type-tag.דוגמה { color:var(--green); }

.act-copy-btn {
  background:none;
  border:1px solid var(--border);
  border-radius:3px;
  padding:3px 10px;
  font-size:0.65rem;
  font-weight:700;
  cursor:pointer;
  font-family:'Assistant',sans-serif;
  letter-spacing:1px;
  color:#999;
  transition:all 0.15s;
}
.act-copy-btn:hover { background:var(--bx); color:#fff; border-color:var(--bx); }
.act-copy-btn.הועתק { background:var(--green); color:#fff; border-color:var(--green); }

.act-block-body { padding:1rem 1.2rem; }

.act-block.פרומפט { border-right:4px solid var(--bx); }
.act-block.שלב { border-right:4px solid var(--step-blue); }
.act-block.תרגיל { border-right:4px dashed #d97706; background:#fffcf5; }
.act-block.דוגמה { border-right:4px solid var(--green); }

.act-title {
  font-size:0.85rem;
  font-weight:800;
  color:#222;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:0.6rem;
}
.act-subtitle {
  font-size:0.82rem;
  font-weight:300;
  color:#666;
  line-height:1.6;
  margin-bottom:0.8rem;
}
.act-dialog {
  font-size:0.8rem;
  font-style:italic;
  color:#888;
  line-height:1.55;
  border-right:2px solid #ddd;
  padding-right:0.7rem;
  margin-bottom:0.8rem;
}
.act-dialog strong { font-style:normal; color:#555; }
.act-prompt {
  font-size:0.85rem;
  color:#111;
  line-height:1.7;
  background:#f8f8f6;
  padding:0.9rem 1rem;
  border-radius:3px;
  font-family:monospace;
  white-space:pre-wrap;
  border:1px solid #eee;
}
.act-exercise-text {
  font-size:0.92rem;
  font-weight:300;
  color:#444;
  line-height:1.75;
}

/* טבלת זכויות */
.rights-table {
  width:100%;
  border-collapse:collapse;
  font-size:0.82rem;
  border-radius:4px;
  overflow:hidden;
  margin-top:0.5rem;
}
.rights-table th {
  background:#222;
  color:#fff;
  padding:0.55rem 0.8rem;
  text-align:right;
  font-weight:700;
  font-size:0.7rem;
  letter-spacing:1px;
}
.rights-table td {
  padding:0.6rem 0.8rem;
  border-bottom:1px solid #f0f0f0;
}
.rights-table tr:last-child td { border-bottom:none; }
.rights-table tr:hover td { background:var(--bx-pale); }
.rights-table .hl { color:var(--bx); font-weight:700; }
.parcel-note {
  margin-top:0.8rem;
  font-size:0.82rem;
  font-weight:300;
  color:#555;
  line-height:1.6;
  border-right:3px solid var(--bx);
  padding-right:0.8rem;
}

/* Checklist */
.cl-cat {
  font-size:0.58rem;
  text-transform:uppercase;
  letter-spacing:5px;
  color:var(--bx);
  font-weight:700;
  margin:1.2rem 0 0.5rem;
  display:block;
}
.cl-item {
  display:flex;
  align-items:center;
  gap:0.6rem;
  padding:0.6rem 0.8rem;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:4px;
  margin-bottom:0.35rem;
  font-size:0.84rem;
  cursor:pointer;
  transition:all 0.18s;
}
.cl-item:hover { border-color:rgba(99,13,22,0.2); }
.cl-dot {
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0.8rem;
  flex-shrink:0;
  transition:all 0.18s;
}
.cl-item.בוצע .cl-dot { background:var(--green); border-color:var(--green); color:#fff; }
.cl-item.בטיפול .cl-dot { background:#f59e0b; border-color:#f59e0b; color:#fff; }
.cl-item.חסר .cl-dot { background:var(--bx); border-color:var(--bx); color:#fff; }
.cl-dept { font-size:0.62rem; color:#ccc; text-transform:uppercase; letter-spacing:2px; margin-right:auto; }
.cl-stats {
  display:flex;
  gap:1.2rem;
  margin-top:1rem;
  padding:0.7rem 1rem;
  background:#f9f9f7;
  border-radius:4px;
}
.cl-stat { text-align:center; }
.cl-stat .n { font-size:1.3rem; font-weight:900; }
.cl-stat .l { font-size:0.55rem; text-transform:uppercase; letter-spacing:2px; color:#bbb; }

/* כרטיסי מטה (פרק 00) */
.meta-cards {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.7rem;
}
.meta-card {
  background:var(--white);
  border:1px solid var(--border);
  border-radius:4px;
  padding:0.8rem 1rem;
}
.meta-card .ml {
  font-size:0.55rem;
  text-transform:uppercase;
  letter-spacing:4px;
  color:#bbb;
  font-weight:700;
  display:block;
  margin-bottom:4px;
}
.meta-card .mv {
  font-size:1rem;
  font-weight:800;
  color:#111;
}

/* improve cards */
.improve-cards {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.7rem;
}
.improve-card { padding:0.7rem 0.9rem; background:var(--white); border:1px solid var(--border); border-radius:4px; }
.improve-card .ic-tag { font-size:0.6rem; text-transform:uppercase; letter-spacing:3px; font-weight:700; color:var(--bx); margin-bottom:3px; display:block; }
.improve-card p { font-size:0.8rem; color:#555; line-height:1.5; font-weight:300; }

/* ═══════════════════════════════
   פאנלים (הערות / קישורים)
═══════════════════════════════ */
.overlay-bg {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.25);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
}
.overlay-bg.open { display:flex; }
.overlay-box {
  background:#fff;
  border-radius:6px;
  width:440px;
  max-width:95vw;
  max-height:80vh;
  display:flex;
  flex-direction:column;
  box-shadow:0 25px 70px rgba(0,0,0,0.15);
}
.overlay-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 1.3rem;
  border-bottom:1px solid var(--border);
}
.overlay-head h3 { font-size:0.95rem; font-weight:800; color:#111; }
.overlay-close { background:none; border:none; font-size:1.2rem; cursor:pointer; color:#aaa; }
.overlay-body { flex:1; overflow-y:auto; padding:1rem 1.3rem; }
.overlay-footer { padding:1rem 1.3rem; border-top:1px solid var(--border); }
.overlay-footer textarea {
  width:100%;
  border:1px solid var(--border);
  border-radius:4px;
  padding:0.6rem;
  font-family:'Assistant',sans-serif;
  font-size:0.85rem;
  resize:vertical;
  outline:none;
}
.overlay-footer textarea:focus { border-color:var(--bx); }
.overlay-save {
  width:100%;
  margin-top:0.5rem;
  background:var(--bx);
  color:#fff;
  border:none;
  padding:0.6rem;
  font-family:'Assistant',sans-serif;
  font-weight:700;
  font-size:0.78rem;
  cursor:pointer;
  border-radius:4px;
  text-transform:uppercase;
  letter-spacing:2px;
}
.overlay-save:hover { background:var(--bx2); }
.note-card {
  background:var(--bx-pale);
  border-right:3px solid var(--bx);
  padding:0.65rem 0.8rem;
  margin-bottom:0.5rem;
  border-radius:0 3px 3px 0;
  font-size:0.82rem;
  line-height:1.5;
}
.note-meta { font-size:0.58rem; color:#bbb; text-transform:uppercase; letter-spacing:2px; margin-bottom:3px; }
.link-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:0.8rem;
  background:#f9f9f7;
  padding:0.45rem 0.7rem;
  border-radius:3px;
  margin-bottom:0.35rem;
}
.link-row a { color:#333; font-weight:600; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-decoration:none; }
.link-row a:hover { color:var(--bx); }
.link-del { background:none; border:none; color:var(--bx); cursor:pointer; font-weight:900; }

/* Toast */
#toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(8px);
  background:#111;
  color:#fff;
  padding:0.55rem 1.5rem;
  border-radius:30px;
  font-size:0.75rem;
  font-weight:700;
  z-index:9999;
  opacity:0;
  transition:all 0.3s;
  pointer-events:none;
  text-transform:uppercase;
  letter-spacing:1px;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ═══ Formatting Toolbar ═══ */
#fmt-toolbar {
  position:fixed;
  z-index:9100;
  background:#1c1c1c;
  border-radius:8px;
  padding:5px 7px;
  display:none;
  gap:3px;
  align-items:center;
  box-shadow:0 6px 28px rgba(0,0,0,0.28);
  pointer-events:auto;
}
#fmt-toolbar.show { display:flex; }
.fmt-btn {
  background:none;
  border:none;
  color:#eee;
  cursor:pointer;
  width:30px;
  height:28px;
  border-radius:5px;
  font-family:'Assistant',sans-serif;
  font-size:0.85rem;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.15s;
  flex-shrink:0;
}
.fmt-btn:hover { background:rgba(255,255,255,0.14); }
.fmt-sep { width:1px; height:16px; background:rgba(255,255,255,0.18); margin:0 3px; flex-shrink:0; }
#fmt-color-pick {
  width:22px; height:22px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.3);
  cursor:pointer;
  padding:0;
  background:none;
  overflow:hidden;
  flex-shrink:0;
}

/* ═══ Resize Handles ═══ */
.resize-handle {
  width:5px;
  flex-shrink:0;
  cursor:col-resize;
  background:transparent;
  position:relative;
  z-index:50;
  transition:background 0.2s;
}
.resize-handle:hover { background:var(--bx-mid); }
.resize-handle.dragging { background:var(--bx-mid); }
.resize-handle::after {
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:2px;
  height:32px;
  border-radius:2px;
  background:var(--border);
  transition:background 0.2s;
}
.resize-handle:hover::after, .resize-handle.dragging::after { background:var(--bx); }

/* Canvas */
#drawing-canvas {
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:300;
  pointer-events:none;
  cursor:crosshair;
}
#drawing-canvas.active { pointer-events:auto; }

/* עריכה */
[contenteditable].edit-on {
  outline:2px dashed var(--bx-mid);
  padding:4px;
  background:rgba(99,13,22,0.015);
  border-radius:2px;
}

/* ══════════ מצב ══════════ */
let activeChapter = null;
let activeSection = null;

/* ══════════ פתיחת פרק ══════════ */
function openChapter(id) {
  activeChapter = id;
  activeSection = null;
  const ch = CHAPTERS[id];

  /* סרגל — צביעה */
  document.querySelectorAll('.nav-ch-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.ch === id)
  );

  /* כותרת חלון הקשר */
  document.getElementById('ctx-chapter-label').textContent = ch.num + ' — ' + ch.title;

  /* בניית חלון הקשר */
  document.getElementById('ctx-body').innerHTML = buildCtxBody(id);
  applyContent();

  /* חלון פעולות — ריק */
  clearAct();
}

function buildCtxBody(id) {
  const ch = CHAPTERS[id];
  let h = `
    <div class="ctx-chapter-num">${ch.num}</div>
    <h2 class="ctx-title" id="ctx-title-${id}" contenteditable="true">${ch.title}</h2>
    <p class="ctx-desc" id="ctx-desc-${id}" contenteditable="true">${ch.desc}</p>
    <div class="ctx-divider"></div>
    <span class="ctx-section-label">בחר נושא לפירוט ←</span>
    <div class="ctx-btn-list">`;

  ch.sections.forEach(s => {
    const cls = typeClass(s.type);
    h += `
      <button class="ctx-btn ${cls}" id="ctxb-${s.id}" onclick="openSection('${id}','${s.id}')">
        ${s.num ? `<span class="btn-num">${s.num}</span>` : ''}
        <span class="btn-label">${s.label}</span>
        <span class="btn-dot"></span>
      </button>`;
  });
  h += `</div>`;
  return h;
}

function typeClass(type) {
  if (type === 'step')     return 'type-step';
  if (type === 'exercise') return 'type-exercise';
  if (type === 'parcel')   return 'type-parcel';
  return '';
}

/* ══════════ פתיחת סעיף → חלון פעולות ══════════ */
function openSection(chId, secId) {
  activeSection = secId;
  const ch  = CHAPTERS[chId];
  const sec = ch.sections.find(s => s.id === secId);

  /* צביעת כפתורי הקשר */
  document.querySelectorAll('.ctx-btn').forEach(b =>
    b.classList.toggle('active', b.id === 'ctxb-' + secId)
  );

  /* כותרת חלון פעולות */
  document.getElementById('act-section-label').textContent = sec.label;

  /* בניית תוכן */
  document.getElementById('act-body').innerHTML = buildActBody(chId, sec);
  applyContent();
}

function buildActBody(chId, sec) {

    let h = block('שלב', `

      ${sec.desc ? `<div class="act-subtitle">${sec.desc}</div>` : ''}

/* ══════════ עזרי בנייה ══════════ */
function block(type, content, copyId) {
  const copyBtn = copyId
    ? `<button class="act-copy-btn" onclick="copyBlock('${copyId}',this)">⎘ העתק</button>`
    : '';
  return `
    <div class="act-block ${type}">
      <div class="act-block-head">
        <span class="act-type-tag ${type}">${type}</span>
        ${copyBtn}
      </div>
      <div class="act-block-body">${content}</div>
    </div>`;
}

function clearAct() {
  document.getElementById('act-section-label').textContent = '—';
  document.getElementById('act-body').innerHTML = `
    <div class="act-empty">
      <div class="act-empty-arrow">←</div>
      <div class="act-empty-text">בחר נושא<br>מחלון ההקשר</div>
    </div>`;
}

/* ══════════ Checklist ══════════ */
function cycleStatus(id) {
  const cur  = clStates[id] || '';
  const next = clCycle[(clCycle.indexOf(cur) + 1) % clCycle.length];
  clStates[id] = next;
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'cl-item ' + next;
  el.querySelector('.cl-dot').innerText = clSyms[next];
  localStorage.setItem('uai_cl', JSON.stringify(clStates));
  updateClStats();
}

function updateClStats() {
  let done=0, pending=0, missing=0;
  Object.values(clStates).forEach(v => {
    if (v==='בוצע') done++;
    else if (v==='בטיפול') pending++;
    else if (v==='חסר') missing++;
  });
  const upd = (id, val) => { const el=document.getElementById(id); if(el) el.innerText=val; };
  const total = Object.keys(CL_ITEMS).reduce((a,k)=>a+CL_ITEMS[k].length,0);
  upd('cl-done', done); upd('cl-pending', pending); upd('cl-missing', missing); upd('cl-total', total);
}

function clStatsHtml() {
  return `<div class="cl-stats">
    <div class="cl-stat"><div class="n" id="cl-done" style="color:#16a34a;">0</div><div class="l">בוצע</div></div>
    <div class="cl-stat"><div class="n" id="cl-pending" style="color:#f59e0b;">0</div><div class="l">בטיפול</div></div>
    <div class="cl-stat"><div class="n" id="cl-missing" style="color:var(--bx);">0</div><div class="l">חסר</div></div>
    <div class="cl-stat"><div class="n" id="cl-total" style="color:#333;">10</div><div class="l">סה"כ</div></div>
  </div>`;
}

function loadChecklist() {
  const saved = JSON.parse(localStorage.getItem('uai_cl') || '{}');
  Object.assign(clStates, saved);
}

/* ══════════ העתקה ══════════ */
function copyBlock(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).catch(() => {
    const t = document.createElement('textarea');
    t.value = el.innerText;
    document.body.appendChild(t); t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
  });
  showToast('הועתק ✓');
  if (btn) {
    btn.classList.add('הועתק');
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('הועתק'); btn.textContent = '⎘ העתק'; }, 2000);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ══════════ הערות ══════════ */
const CH_NAMES = {'00':'פתיחה','01':'זיקוק','02':'ניתוח','03':'בנייה','ma':'מ׳א','mb':'מ׳ב'};

function openNotes() {
  document.getElementById('note-ctx-label').textContent =
    activeChapter ? 'הקשר: ' + CH_NAMES[activeChapter] : 'ללא הקשר';
  renderNotes();
  openPnl('notes-overlay');
}
function saveNote() {
  const input = document.getElementById('note-input');
  const text = input.value.trim();
  if (!text) return;
  let notes = JSON.parse(localStorage.getItem('uai_notes') || '[]');
  notes.unshift({ ch: activeChapter, text, time: new Date().toLocaleDateString('he-IL') });
  localStorage.setItem('uai_notes', JSON.stringify(notes));
  input.value = '';
  renderNotes();
  showToast('הערה נשמרה ✓');
}
function renderNotes() {
  const notes = JSON.parse(localStorage.getItem('uai_notes') || '[]');
  const list = document.getElementById('notes-list');
  if (!notes.length) { list.innerHTML = '<div style="color:#ccc;font-size:0.82rem;text-align:center;padding:1.5rem;">אין הערות עדיין</div>'; return; }
  list.innerHTML = notes.map((n,i) => `
    <div class="note-card">
      <div class="note-meta">${CH_NAMES[n.ch]||n.ch||'כללי'} · ${n.time}
        <button onclick="deleteNote(${i})" style="background:none;border:none;color:var(--bx);cursor:pointer;font-weight:900;margin-right:6px;">×</button>
      </div>${n.text}
    </div>`).join('');
}
function deleteNote(i) {
  let notes = JSON.parse(localStorage.getItem('uai_notes') || '[]');
  notes.splice(i, 1);
  localStorage.setItem('uai_notes', JSON.stringify(notes));
  renderNotes();
}
function exportNotes() {
  const notes = JSON.parse(localStorage.getItem('uai_notes') || '[]');
  const text = notes.map(n => `[${CH_NAMES[n.ch]||'כללי'}] ${n.time}\n${n.text}`).join('\n\n---\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/plain;charset=utf-8' }));
  a.download = 'uai-notes.txt';
  a.click();
}

/* ══════════ קישורים ══════════ */
function openLinks() { renderLinks(); openPnl('links-overlay'); }
function saveLink() {
  const input = document.getElementById('link-input');
  if (!input.value.trim()) return;
  let links = JSON.parse(localStorage.getItem('studio_links') || '[]');
  links.push(input.value.trim());
  localStorage.setItem('studio_links', JSON.stringify(links));
  input.value = '';
  renderLinks();
  showToast('קישור נשמר ✓');
}
function renderLinks() {
  const links = JSON.parse(localStorage.getItem('studio_links') || '[]');
  const list = document.getElementById('links-list');
  if (!links.length) { list.innerHTML = '<div style="color:#ccc;font-size:0.82rem;padding:1rem;">אין קישורים</div>'; return; }
  list.innerHTML = links.map((l,i) => `
    <div class="link-row">
      <a href="${l.startsWith('http')?l:'https://'+l}" target="_blank">${l}</a>
      <button class="link-del" onclick="removeLink(${i})">×</button>
    </div>`).join('');
}
function removeLink(i) {
  let links = JSON.parse(localStorage.getItem('studio_links') || '[]');
  links.splice(i, 1);
  localStorage.setItem('studio_links', JSON.stringify(links));
  renderLinks();
}

/* ══════════ פאנלים ══════════ */
function openPnl(id) { document.getElementById(id).classList.add('open'); }
function closePnl(id) { document.getElementById(id).classList.remove('open'); }

/* ══════════ Canvas ══════════ */
const canvas = document.getElementById('drawing-canvas');
const ctx = canvas.getContext('2d');
let drawing = false, drawMode = false;
function resize() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
function toggleDraw() {
  drawMode = !drawMode;
  canvas.classList.toggle('active', drawMode);
  document.getElementById('btn-draw').classList.toggle('active', drawMode);
}
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
function pos(e) { return e.touches ? {x:e.touches[0].clientX,y:e.touches[0].clientY} : {x:e.clientX,y:e.clientY}; }
canvas.addEventListener('mousedown', e=>{ if(!drawMode)return; drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
canvas.addEventListener('mousemove', e=>{ if(!drawing||!drawMode)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle='#630d16'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); });
canvas.addEventListener('mouseup', ()=>drawing=false);
canvas.addEventListener('touchstart', e=>{ if(!drawMode)return; e.preventDefault(); drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); },{passive:false});
canvas.addEventListener('touchmove', e=>{ if(!drawing||!drawMode)return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle='#630d16'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); },{passive:false});
canvas.addEventListener('touchend', ()=>drawing=false);

/* ══════════ עריכה ══════════ */
let editMode = false;
function toggleEdit() {
  editMode = !editMode;
  document.getElementById('btn-edit').classList.toggle('active', editMode);
  document.querySelectorAll('[contenteditable]').forEach(el => el.classList.toggle('edit-on', editMode));
}

/* ══════════ Formatting Toolbar ══════════ */
const fmtBar = document.getElementById('fmt-toolbar');
let savedRange = null;

document.addEventListener('selectionchange', () => {
  const sel = document.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) {
    fmtBar.classList.remove('show');
    return;
  }
  const node = sel.anchorNode;
  const el = node ? (node.nodeType === 3 ? node.parentElement : node) : null;
  if (!el || !el.closest('[contenteditable]')) { fmtBar.classList.remove('show'); return; }

  savedRange = sel.getRangeAt(0).cloneRange();
  const rect = savedRange.getBoundingClientRect();
  const tW = 220;
  let left = rect.left + rect.width / 2 - tW / 2;
  left = Math.max(8, Math.min(window.innerWidth - tW - 8, left));
  let top = rect.top - 52;
  if (top < 8) top = rect.bottom + 8;
  fmtBar.style.top  = top  + 'px';
  fmtBar.style.left = left + 'px';
  fmtBar.classList.add('show');
});

fmtBar.addEventListener('mousedown', e => e.preventDefault());

function restoreSelection() {
  if (!savedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedRange);
}

function fmt(cmd, value) {
  restoreSelection();
  document.execCommand(cmd, false, value || null);
  saveContent();
}

function fmtSize(delta) {
  restoreSelection();
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const node = sel.anchorNode;
  const el = node ? (node.nodeType === 3 ? node.parentElement : node) : null;
  const cur = el ? (parseFloat(window.getComputedStyle(el).fontSize) || 14) : 14;
  const next = Math.max(8, Math.min(60, cur + delta * 2));
  document.execCommand('fontSize', false, '7');
  document.querySelectorAll('font[size="7"]').forEach(f => {
    const span = document.createElement('span');
    span.style.fontSize = next + 'px';
    span.innerHTML = f.innerHTML;
    f.replaceWith(span);
  });
  saveContent();
}

/* כפתורי Bold / Italic */
document.getElementById('fmt-bold').addEventListener('mousedown',   e => { e.preventDefault(); fmt('bold'); });
document.getElementById('fmt-italic').addEventListener('mousedown', e => { e.preventDefault(); fmt('italic'); });
document.getElementById('fmt-color-pick').addEventListener('input', e => { fmt('foreColor', e.target.value); });

/* ══════════ Panel Resize ══════════ */
const navBarEl  = document.getElementById('nav-bar');
const ctxPaneEl = document.getElementById('ctx-pane');
let resizing = null, resizeStartX = 0, resizeStartW = 0;

['rh-1', 'rh-2'].forEach(rhId => {
  document.getElementById(rhId).addEventListener('mousedown', e => {
    resizing = rhId;
    resizeStartX = e.clientX;
    resizeStartW = rhId === 'rh-1' ? navBarEl.offsetWidth : ctxPaneEl.offsetWidth;
    document.getElementById(rhId).classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
});

document.addEventListener('mousemove', e => {
  if (!resizing) return;
  const dx = resizeStartX - e.clientX; /* RTL: drag left = grow */
  if (resizing === 'rh-1') {
    navBarEl.style.width  = Math.max(160, Math.min(350, resizeStartW + dx)) + 'px';
  } else {
    ctxPaneEl.style.width = Math.max(250, Math.min(600, resizeStartW + dx)) + 'px';
  }
});

document.addEventListener('mouseup', () => {
  if (!resizing) return;
  document.getElementById(resizing).classList.remove('dragging');
  resizing = null;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  savePanelWidths();
});

/* ══════════ Content Persistence ══════════ */
document.addEventListener('input', e => {
  if (e.target.contentEditable === 'true') saveContent();
});

function saveContent() {
  const existing = JSON.parse(localStorage.getItem('uai_content') || '{}');
  document.querySelectorAll('[contenteditable][id]').forEach(el => {
    existing[el.id] = el.innerHTML;
  });
  localStorage.setItem('uai_content', JSON.stringify(existing));
}

function loadContent() {
  window._savedContent = JSON.parse(localStorage.getItem('uai_content') || '{}');
}

function applyContent() {
  const data = window._savedContent || {};
  Object.entries(data).forEach(([id, html]) => {
    const el = document.getElementById(id);
    if (el && el.contentEditable === 'true') el.innerHTML = html;
  });
}

function saveAll() {
  saveContent();
  savePanelWidths();
  localStorage.setItem('uai_cl', JSON.stringify(clStates));
  /* אנימציית כפתור */
  const btn   = document.getElementById('save-btn');
  const label = document.getElementById('save-label');
  const icon  = document.getElementById('save-icon');
  btn.style.background = '#16a34a';
  label.textContent = 'נשמר ✓';
  icon.textContent  = '✓';
  setTimeout(() => {
    btn.style.background = '';
    label.textContent = 'שמור';
    icon.textContent  = '💾';
  }, 1800);
  showToast('כל השינויים נשמרו ✓');
}

function savePanelWidths() {
  localStorage.setItem('uai_panels', JSON.stringify({
    nav: navBarEl.offsetWidth,
    ctx: ctxPaneEl.offsetWidth
  }));
}

function loadPanelWidths() {
  try {
    const d = JSON.parse(localStorage.getItem('uai_panels') || '{}');
    if (d.nav) navBarEl.style.width = d.nav + 'px';
    if (d.ctx) ctxPaneEl.style.width = d.ctx + 'px';
  } catch(e) {}
}

/* ══════════ אתחול ══════════ */
loadChecklist();
loadContent();
loadPanelWidths();
</script>
